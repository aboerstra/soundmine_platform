name: Soundmine Studio contracts

on:
  push:
    paths:
      - 'schemas/studio/**'
      - 'fixtures/studio/**'
      - 'scripts/validate_studio_contracts.py'
      - 'scripts/validate-studio-fixtures.mjs'
      - '.github/workflows/studio-contracts.yml'
  pull_request:
    paths:
      - 'schemas/studio/**'
      - 'fixtures/studio/**'
      - 'scripts/validate_studio_contracts.py'
      - 'scripts/validate-studio-fixtures.mjs'
      - '.github/workflows/studio-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Validate Studio schemas, fixtures and graph
        run: python scripts/validate_studio_contracts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run dependency-free fixture smoke test
        run: node scripts/validate-studio-fixtures.mjs
