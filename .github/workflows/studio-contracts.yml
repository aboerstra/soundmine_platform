name: Soundmine Studio contracts

on:
  push:
    paths:
      - 'schemas/studio/**'
      - 'fixtures/studio/**'
      - 'native/studio/**'
      - 'scripts/validate_studio_contracts.py'
      - 'scripts/validate-studio-fixtures.mjs'
      - '.github/workflows/studio-contracts.yml'
  pull_request:
    paths:
      - 'schemas/studio/**'
      - 'fixtures/studio/**'
      - 'native/studio/**'
      - 'scripts/validate_studio_contracts.py'
      - 'scripts/validate-studio-fixtures.mjs'
      - '.github/workflows/studio-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Validate Studio schemas, fixtures and graph
        run: python scripts/validate_studio_contracts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run dependency-free fixture smoke test
        run: node scripts/validate-studio-fixtures.mjs

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Configure native workflow core
        run: cmake -S native/studio -B studio-build -DCMAKE_BUILD_TYPE=Release
      - name: Build native workflow core
        run: cmake --build studio-build --config Release --parallel 2
      - name: Test native workflow core
        run: ctest --test-dir studio-build -C Release --output-on-failure
      - name: Check native output against published schemas
        run: python scripts/validate_studio_contracts.py --native-output studio-build/conformance
