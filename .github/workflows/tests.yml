name: Validate foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: soundmine_test
          POSTGRES_USER: soundmine
          POSTGRES_PASSWORD: local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soundmine -d soundmine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, sodium
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: vendor/bin/pint --test
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: composer test
