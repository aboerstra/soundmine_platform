services:
  app:
    image: soundmine-dev:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: soundmine
      POSTGRES_USER: soundmine
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-testing.sql:/docker-entrypoint-initdb.d/init-testing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundmine -d soundmine"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
